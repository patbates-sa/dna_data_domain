# To set them up:
#   1. Open Terminal
#   2. Run this command to open your shell config file:
#        open -e ~/.zshrc
#   3. Add these 2 lines at the bottom (replace the values with your own):
#
#        export DBT_SNOWFLAKE_USER="your_snowflake_sso_email"
#        export DBT_DEVELOPMENT_SCHEMA="dbt_yourname"
#
#   4. Save (Cmd+S) and close the file
#   5. Run this in Terminal to apply the changes:
#        source ~/.zshrc
#   6. Test your connection (a browser window will open for SSO login):
#        dbt debug
#
# =============================================================================

