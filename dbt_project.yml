# Name of the project and initial config info
name: 'dna_data_domain'
version: '1.0.0'

# dbt_query_tags: enables query tagging and comments for Snowflake query observability.
# See https://hub.getdbt.com/get-select/dbt_query_tags/latest/
dispatch:
  - macro_namespace: dbt
    search_order:
      - dna_data_domain
      - dbt_query_tags
      - dbt

# on-run-start:
#   - "{{ validate_mesh(selected_only=true) }}"


query-comment:
  comment: '{{ dbt_query_tags.get_query_comment(node) }}'
  append: true  # Snowflake removes prefixed comments

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

# ----------------------------------
# Project variables
# ----------------------------------
vars:
  # Controls whether models and tests tagged 'designed_to_fail' are enabled.
  # These resources are intentionally built to fail for demo / testing purposes.
  # They are disabled by default so they don't break normal CI/CD runs.
  # Override at invocation time with: dbt build --vars '{run_designed_to_fail: true}'
  run_designed_to_fail: false

  ## Following are for mesh validation
  mesh_products_project: dna_data_products
  mesh_domain_project: dna_data_domain


target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Model configurations
models:
  dna_data_domain:
    +static_analysis: strict
    0_staging:
      +materialized: view
      +state:
        lag_tolerance: 2h
    2_marts:
      +materialized: "{{ env_var('DBT_MATERIALIZATION', 'view') }}"
      +state:
        lag_tolerance: 1d
      +grants:
        select: ['REPORTER']