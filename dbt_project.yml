# Name of the project and initial config info
name: 'data_engineering'
version: '1.0.0'
dbt-cloud:
    project-id: 70437463662253
    account-host: "tr995.us1.dbt.com"

# This profile is only used by ./dbt/profiles.yml when running locally, not relevant for cloud runs.
profile: 'tr995_us1_70437463662253'

# These configurations specify where dbt should look for different types of files.
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"  # directory which will store compiled SQL files
clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Model configurations
models:
  data_engineering:
    0_staging:
      +materialized: view
      +freshness:
        build_after:
          count: 2
          period: hour
    2_marts:
      +materialized: "{{ env_var('DBT_MATERIALIZATION', 'view') }}"
      +freshness:
        build_after:
          count: 1
          period: day
      +grants:
        select: ['REPORTER']