# =============================================================================
# Branch Cleanup - Caller Workflow
# =============================================================================
# This workflow calls the reusable branch cleanup workflow from the Terraform
# repository to automatically delete stale branches older than 7 days.
#
# Runs daily at 3 AM UTC and can be triggered manually via workflow_dispatch.
#
# Default protected patterns (from reusable workflow):
#   - main, UAT, develop
#   - feat/*, fix/*, hotfix/*, release/*
#
# To add additional protected patterns for this repo, set extra_protected_patterns
# in the 'with' block below.
# =============================================================================

name: Branch Cleanup

on:
  schedule:
    # Run daily at 3 AM UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (only log, do not delete)"
        type: boolean
        default: false

jobs:
  cleanup:
    permissions:
      contents: write
      pull-requests: write
    uses: dbt-labs/sa-demo-terraform/.github/workflows/branch-cleanup.yml@main
    with:
      dry_run: ${{ inputs.dry_run || false }}
