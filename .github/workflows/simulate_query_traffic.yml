name: Simulate Query Traffic

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  simulate-query-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt-snowflake
        run: pip install dbt-snowflake

      - name: Install dbt packages
        run: dbt deps

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_rsa_key.p8
          chmod 600 /tmp/snowflake_rsa_key.p8

      - name: Simulate query traffic
        env:
          DBT_SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
          DBT_SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_rsa_key.p8
          DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
          DBT_DEVELOPMENT_SCHEMA: PRODUCTION
        run: >
          dbt run-operation simulate_query_traffic
          --args '{"database_name": "DATA_ENGINEERING", "schema_name": "PRODUCTION"}'
