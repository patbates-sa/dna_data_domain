name: Simulate Query Traffic

on:
  schedule:
    - cron: "0 0 * * *"  # Daily at midnight UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  simulate-query-traffic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install snowflake-connector-python cryptography

      - name: Write Snowflake private key
        run: |
          echo "${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}" > /tmp/snowflake_rsa_key.p8
          chmod 600 /tmp/snowflake_rsa_key.p8

      - name: Simulate query traffic
        env:
          SNOWFLAKE_USER: ${{ secrets.DBT_SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/snowflake_rsa_key.p8
          SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: python scripts/simulate_query_traffic.py
