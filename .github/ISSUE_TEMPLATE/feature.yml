# Feature / Change Request Issue Template
# -------------------------------------------------
# This YAML-based GitHub Issue Form is presented when
# a user selects "Feature/Change Request" from the
# New Issue chooser. It auto-applies the "enhancement"
# label and collects structured information about the
# proposed feature or change.
#
# Used by SA / SE teams to request improvements to
# this dbt project for customer demos.
# -------------------------------------------------

name: Feature/Change Request
description: Suggest a new feature or change
labels: ["enhancement"]

body:
  # ---- Summary ----
  # Core description of the feature or change being requested.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A brief description of the feature or change you'd like.
      placeholder: Describe the feature or change...
    validations:
      required: true

  # ---- Motivation ----
  # Why is this feature or change needed?
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this needed? What problem does it solve?
      placeholder: Explain the motivation or use case...
    validations:
      required: false

  # ---- Proposed Solution ----
  # How could this be implemented?
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: If you have ideas on how this could be implemented, describe them here.
      placeholder: Describe a possible implementation...
    validations:
      required: false

  # ---- Additional Context ----
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any extra information, references, or examples that may help.
      placeholder: Paste links, examples, or other context here...
    validations:
      required: false
