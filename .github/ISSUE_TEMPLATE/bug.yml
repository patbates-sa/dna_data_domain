# Bug Report Issue Template
# -------------------------------------------------
# This YAML-based GitHub Issue Form is presented when
# a user selects "Bug" from the New Issue chooser.
# It auto-applies the "bug" label and collects
# structured information including a priority level.
#
# Used by SA / SE teams to report issues found in
# this dbt project during customer demos.
# -------------------------------------------------

name: Bug
description: Report a bug or issue with this dbt project
labels: ["bug"]

body:
  # ---- Priority Dropdown ----
  # Required field that determines the severity of the bug.
  # The issue-labeler workflow parses this value to auto-apply
  # a P0 or P1 label to the issue.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: Select the severity of this bug.
      options:
        - "P0 - Major bug (dbt project has major issues or is unusable)"
        - "P1 - Minor bug (dbt project is mostly usable or can use workaround)"
    validations:
      required: true

  # ---- Description ----
  # Core description of what went wrong.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  # ---- Steps to Reproduce ----
  # Optional but helpful for debugging.
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Run '...'
        3. See error
    validations:
      required: false

  # ---- Expected Behavior ----
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected...
    validations:
      required: false

  # ---- Additional Context ----
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any extra information, screenshots, logs, or links that may help.
      placeholder: Paste logs, screenshots, or other context here...
    validations:
      required: false
