version: 2

models:
  - name: agg_monthly_gross_revenue
    description: >
      Monthly aggregation of gross revenue from order items. Provides a time-series 
      view of total gross sales by month for trend analysis and reporting.
    columns:
      - name: order_month
        description: The first day of the month for the aggregated order data
        data_tests:
          - unique
          - not_null
      - name: gross_revenue
        description: Sum of gross item sales amount for all orders in the month
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0

  - name: agg_returned_orders_by_month
    description: >
      Monthly aggregation of returned orders and return rates. Tracks the number of 
      returned order items and calculates the return rate as a percentage of total orders.
    config:
      tags: ['designed_to_fail']
    columns:
      - name: order_month
        description: The first day of the month for the aggregated return data
        data_tests:
          - unique
          - not_null
      - name: returned_orders
        description: Count of order items that were returned in the month
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: return_rate
        description: Percentage of order items that were returned (returned_orders / total_orders)
      - name: row_count
        description: Total count of order items processed in the month

  - name: agg_customer_orders
    description: >
      Aggregated order metrics by customer. Combines order item facts with customer 
      dimensions to provide a summary of each customer's ordering behavior including 
      total orders, sales amounts, and return counts.
    columns:
      - name: customer_key
        description: Unique identifier for the customer
        data_tests:
          - unique
          - not_null
      - name: customer_name
        description: Name of the customer
      - name: nation
        description: Nation where the customer is located
      - name: region
        description: Region where the customer is located
      - name: market_segment
        description: Market segment the customer belongs to
      - name: total_orders
        description: Total number of distinct orders placed by the customer
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: total_order_items
        description: Total number of order line items for the customer
      - name: total_gross_sales
        description: Sum of gross sales amount for all order items
      - name: total_net_sales
        description: Sum of net sales amount for all order items
      - name: total_returns
        description: Count of returned order items
      - name: avg_order_item_value
        description: Average gross sales value per order item

  - name: agg_supplier_orders
    description: >
      Aggregated order metrics by supplier. Combines order item facts with supplier 
      dimensions to provide a summary of each supplier's order volume, revenue, 
      costs, and gross margin.
    config:
      tags: ['designed_to_fail']
    columns:
      - name: supplier_key
        description: Unique identifier for the supplier
        data_tests:
          - unique
          - not_null
      - name: supplier_name
        description: Name of the supplier
      - name: nation
        description: Nation where the supplier is located
      - name: region
        description: Region where the supplier is located
      - name: total_orders
        description: Total number of distinct orders containing items from this supplier
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
          - dbt_expectations.expect_column_values_to_be_between:
              name: agg_supplier_orders_total_orders_under_650
              config:
                severity: error
                store_failures: true
                tags: ['designed_to_fail']
              arguments:
                max_value: 650
      - name: total_order_items
        description: Total number of order line items from this supplier
      - name: total_gross_sales
        description: Sum of gross sales amount for all order items from this supplier
      - name: total_net_sales
        description: Sum of net sales amount for all order items from this supplier
      - name: total_supplier_cost
        description: Total cost paid to the supplier for all items
      - name: gross_margin
        description: Difference between gross sales and supplier cost

exposures:
  - name: returned_orders
    type: dashboard
    maturity: high
    url: https://fishtown.looker.com/dashboards/606
    description: 
      How is our return rate trending over time?

    depends_on:
      - ref('agg_returned_orders_by_month')

    owner:
      name: Alex 
      email: alex.dinsmoor@dbtlabs.com 


  - name: active_orders
    type: dashboard
    maturity: high
    url: https://fishtown.looker.com/dashboards/493
    description: 
      Did someone say "exponential growth"?
    
    depends_on:
      - ref('fct_orders')
      - ref('dim_suppliers')
      
    owner:
      name: Isabela 
      email: isabela@dbtlabs.com

  - name: business_pulse
    type: dashboard
    maturity: high
    url: https://public.tableau.com/app/profile/mike.burke2608/viz/BDLDemo/BusinessPulse_1
    description: 
      Business Pulse for use by anyone looking to get insights on orders. 
    
    depends_on:
      - ref('fct_orders')
      - ref('dim_suppliers')
      - ref('dim_customers')

    owner:
      name: Business Operations Team 
      email: bizops@dbtlabs.com