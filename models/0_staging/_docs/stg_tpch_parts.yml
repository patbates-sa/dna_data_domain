# Documentation for stg_tpch_parts model
# Staging layer for parts data

models:
  - name: stg_tpch_parts
    description: Staging layer for parts data
    columns:
      - name: part_key
        description: Primary key of the model
        data_tests:
          - unique
          - not_null
      - name: name
        description: Name of the part
      - name: manufacturer
        description: Manufacturer of the part
      - name: brand
        description: Brand of the part
      - name: type
        description: Type of part including material
      - name: size
        description: Size of the part
      - name: container
        description: Container of the part
      - name: retail_price
        description: '{{ doc("retail_price") }}'
      - name: comment
        description: '{{ doc("comment") }}'
