# Documentation for stg_customers model
# Staging layer for customers data

models:
  - name: stg_customers
    description: Staging layer for customers data
    columns:
      - name: customer_key
        description: Primary key of the model
        data_tests:
          - unique
          - not_null
      - name: name
        description: Full name of the customer
      - name: address
        description: Address of the customer
      - name: nation_key
        description: Foreign key to stg_nations
      - name: phone_number
        description: Phone number of the customer
      - name: account_balance
        description: Customer account balance from the source system, modeled as a dollar-denominated amount.
      - name: market_segment
        description: Market segment of the customer
      - name: comment
        description: '{{ doc("comment") }}'
