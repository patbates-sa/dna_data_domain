# Documentation for stg_suppliers model
# Staging layer for suppliers data

models:
  - name: stg_suppliers
    description: Staging layer for suppliers data
    columns:
      - name: supplier_key
        description: Primary key of the model
        data_tests:
          - unique
          - not_null
      - name: supplier_name
        description: '{{ doc("supplier_name") }}'
      - name: supplier_address
        description: '{{ doc("supplier_address") }}'
      - name: nation_key
        description: Foreign key to stg_nations
      - name: phone_number
        description: '{{ doc("phone_number") }}'
      - name: account_balance
        description: Supplier account balance from the source system, modeled as a dollar-denominated amount.
        data_tests:
          - greater_than_or_equal_to_zero:
              config:
                severity: warn
      - name: comment
        description: '{{ doc("comment") }}'
