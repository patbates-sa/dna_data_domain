# Documentation for stg_line_items model
# Staging layer for line items data

models:
  - name: stg_line_items
    description: Staging layer for line items data
    columns:
      - name: order_item_key
        description: '{{ doc("order_item_key") }}'
        data_tests:
          - unique
          - not_null
      - name: order_key
        description: Foreign key to stg_orders
      - name: part_key
        description: Foreign key to stg_part_suppliers
      - name: supplier_key
        description: Foreign key to stg_suppliers
      - name: line_number
        description: '{{ doc("line_number") }}'
      - name: quantity
        description: Total units
      - name: extended_price
        description: '{{ doc("extended_price") }}'
      - name: discount_percentage
        description: '{{ doc("discount_percentage") }}'
      - name: tax_rate
        description: Tax rate of the order item
      - name: return_flag
        description: '{{ doc("return_flag") }}'
        data_tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ['returned', 'accepted', 'not_returned']
      - name: is_return
        description: '{{ doc("is_return") }}'
      - name: status_code
        description: Status code of the order item
        data_tests:
          - accepted_values:
              arguments:
                values: ['returned', 'billed', 'shipped']
      - name: ship_date
        description: '{{ doc("ship_date") }}'
      - name: commit_date
        description: '{{ doc("commit_date") }}'
      - name: receipt_date
        description: '{{ doc("receipt_date") }}'
      - name: ship_instructions
        description: Additional instructions on the shipment
      - name: ship_mode
        description: '{{ doc("ship_mode") }}'
      - name: comment
        description: '{{ doc("comment") }}'

unit_tests:
  - name: stg_line_items_maps_return_flags
    description: Return flags map to the expected status and return indicator.
    model: stg_line_items
    given:
      - input: source('tpch_now', 'lineitem')
        format: sql
        rows: |
          select
              row_number() over (order by column1) as l_orderkey,
              cast(null as number) as l_partkey,
              cast(null as number) as l_suppkey,
              1 as l_linenumber,
              cast(null as number) as l_quantity,
              cast(null as number) as l_extendedprice,
              cast(null as number) as l_discount,
              cast(null as number) as l_tax,
              column1 as l_returnflag,
              cast(null as varchar) as l_linestatus,
              cast(null as date) as l_shipdate,
              cast(null as date) as l_commitdate,
              cast(null as date) as l_receiptdate,
              cast(null as varchar) as l_shipinstruct,
              cast(null as varchar) as l_shipmode,
              cast(null as varchar) as l_comment,
              cast(null as timestamp) as loaded_at
          from values ('R'), ('A'), ('N'), ('X')
    expect:
      rows:
        - {return_flag: returned, is_return: true}
        - {return_flag: accepted, is_return: false}
        - {return_flag: not_returned, is_return: false}
        - {return_flag: unknown, is_return: false}
