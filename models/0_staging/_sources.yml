# This file defines the raw data sources from Snowflake's TPCH sample data

sources:
  - name: tpch
    description: Welcome to the dbt Labs demo dbt project! We use the [TPCH dataset](https://docs.snowflake.com/en/user-guide/sample-data-tpch.html) to create a sample project to emulate what a production project might look like!
    database: raw
    schema: tpch_sf001
    tables:
      - name: customer
        description: Main customer table
        columns:
          - name: c_custkey
            description: Unique customer key
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn
          - name: c_name
            description: Customer identifier
          - name: c_address
            description: Address of the customer
          - name: c_nationkey
            description: Foreign key to stg_tpch_nations
          - name: c_phone
            description: Phone number of the customer
          - name: c_acctbal
            description: Raw account balance
          - name: c_mktsegment
            description: Market segment of the customer
          - name: c_comment
            description: '{{ doc("comment") }}'

      - name: nation
        description: Nation mapping
        columns:
          - name: n_nationkey
            description: 25 nations are populated
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn
          - name: n_name
            description: Nation name
          - name: n_regionkey
            description: Foreign key to R_REGIONKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'region')
                    field: r_regionkey
          - name: n_comment
            description: '{{ doc("comment") }}'

      - name: part
        description: Main part table
        columns:
          - name: p_partkey
            description: SF*200,000 are populated
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn
          - name: p_name
            description: Name of the part
          - name: p_mfgr
            description: Manufacturer of the part
          - name: p_brand
            description: Brand of the part
          - name: p_type
            description: Type of part including material
          - name: p_size
            description: Size of the part
          - name: p_container
            description: Container of the part
          - name: p_retailprice
            description: Raw retail price
          - name: p_comment
            description: '{{ doc("comment") }}'

      - name: partsupp
        description: Main part supplier table
        columns:
          - name: ps_partkey
            description: Foreign key to P_PARTKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'part')
                    field: p_partkey
          - name: ps_suppkey
            description: Foreign key to S_SUPPKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'supplier')
                    field: s_suppkey
          - name: ps_availqty
            description: Raw available quantity
          - name: ps_supplycost
            description: Raw cost
          - name: ps_comment
            description: '{{ doc("comment") }}'

      - name: region
        description: Region mapping
        columns:
          - name: r_regionkey
            description: 5 regions are populated
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn
          - name: r_name
            description: Region name
          - name: r_comment
            description: '{{ doc("comment") }}'

      - name: supplier
        description: Main supplier table
        columns:
          - name: s_suppkey
            description: SF*10,000 are populated
            data_tests:
              - unique:
                  config:
                    severity: warn
              - not_null:
                  config:
                    severity: warn
          - name: s_name
            description: Identifier of the supplier
          - name: s_address
            description: Address of the supplier
          - name: s_nationkey
            description: Foreign key to N_NATIONKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'nation')
                    field: n_nationkey
          - name: s_phone
            description: Phone number of the supplier
          - name: s_acctbal
            description: Raw account balance
          - name: s_comment
            description: '{{ doc("comment") }}'
    config:
      freshness: # make this a warning as this is static data
        warn_after: { count: 12, period: hour }
  - name: tpch_now
    description: Welcome to the dbt Labs demo dbt project! We use the [TPCH dataset](https://docs.snowflake.com/en/user-guide/sample-data-tpch.html) to create a sample project to emulate what a production project might look like!
    database: raw
    schema: tpch_now
    tables:
      - name: orders
        description: Main order tracking table
        config:
          freshness:
            warn_after: { count: 3, period: day }
          loaded_at_field: "o_orderdate::timestamp"

        columns:
          - name: o_orderkey
            description: SF*1,500,000 are sparsely populated
            data_tests:
              - unique
              - not_null

          - name: o_custkey
            description: Foreign key to C_CUSTKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'customer')
                    field: c_custkey
          - name: o_orderstatus
            description: Status code of the order
          - name: o_totalprice
            description: Raw price
          - name: o_orderdate
            description: Date the order was made
          - name: o_ordertime
            description: Time the order was made
          - name: o_orderpriority
            description: Code associated with the order
          - name: o_clerk
            description: Identifier of the clerk
          - name: o_shippriority
            description: Numeric representation of the shipping priority, zero being the default
          - name: o_comment
            description: '{{ doc("comment") }}'
      - name: lineitem
        description: Main lineitem table
        columns:
          - name: l_orderkey
            description: Foreign key to O_ORDERKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch_now', 'orders')
                    field: o_orderkey
          - name: l_partkey
            description: Foreign key to P_PARTKEY, first part of the compound foreign key to (PS_PARTKEY, PS_SUPPKEY) with L_SUPPKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'part')
                    field: p_partkey
          - name: l_suppkey
            description: Foreign key to S_SUPPKEY, second part of the compound foreign key to (PS_PARTKEY, PS_SUPPKEY) with L_PARTKEY
            data_tests:
              - relationships:
                  arguments:
                    to: source('tpch', 'supplier')
                    field: s_suppkey
          - name: l_linenumber
            description: Sequence of the order items within the order
          - name: l_quantity
            description: Total units
          - name: l_extendedprice
            description: Line item price
          - name: l_discount
            description: Percentage of the discount
          - name: l_tax
            description: Tax rate of the order item
          - name: l_returnflag
            description: Letter determining the status of the return (R=returned, A=accepted)
            data_tests:
              - accepted_values:
                  config:
                    severity: warn
                  arguments:
                    values: ["R", "A"]
          - name: l_linestatus
            description: Status code of the order item (P=returned, F=billed, O=shipped)
            data_tests:
              - accepted_values:
                  arguments:
                    values: ["P", "F", "O"]
          - name: l_shipdate
            description: The date the order item is being shipped
          - name: l_commitdate
            description: The date the order item is being committed
          - name: l_receiptdate
            description: The receipt date of the order item
          - name: l_shipinstruct
            description: Additional instructions on the shipment
          - name: l_shipmode
            description: Method of shipping
          - name: l_comment
            description: '{{ doc("comment") }}'

        config:
          freshness:
            warn_after: { count: 3, period: day }
          loaded_at_field: "l_shipdate::timestamp"
          meta:
            schema: tpch_now
