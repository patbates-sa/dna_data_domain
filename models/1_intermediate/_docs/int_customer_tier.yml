# Documentation for int_customer_tier model
# Intermediate model for customer tiering logic

models:
  - name: int_customer_tier
    description: >
      Intermediate model that classifies customers into value tiers based on their 
      lifetime purchase value. Calculates the sum of total_price from all orders 
      and assigns customers to tiers 1-4 based on spending thresholds.
    columns:
      - name: customer_key
        description: Primary key of the model - unique identifier for each customer
        data_tests:
          - unique
      - name: lifetime_value
        description: >
          Total cumulative value of all orders placed by the customer, calculated as 
          sum(total_price) from orders. Used to determine customer tier classification.
      - name: tier_name
        description: >
          Customer value tier classification based on lifetime_value thresholds:
          tier1 (<=200k), tier2 (>2M), tier3 (1M-1.99M), tier4 (0-999k)

unit_tests:
  - name: tiers_are_working
    description: Check if the logic for tiering is working correctly
    model: int_customer_tier
    given:
      - input: ref('stg_tpch_customers')
        format: dict
        rows:
          - {customer_key: 629}
          - {customer_key: 4}
          - {customer_key: 1}
          - {customer_key: 26}

      - input: ref('stg_tpch_orders')
        format: dict
        rows:
          - {customer_key: 629, total_price: 163443}
          - {customer_key: 4, total_price: 4134568}
          - {customer_key: 1, total_price: 1428872}
          - {customer_key: 26, total_price: 418512}

    expect:
      rows:
        - {customer_key: 629, tier_name: tier1}
        - {customer_key: 4, tier_name: tier2}
        - {customer_key: 1, tier_name: tier3}
        - {customer_key: 26, tier_name: tier4}
