# Documentation for fct_agg_returned_orders_by_month model
# Monthly aggregation of returned orders and return rates

models:
  - name: fct_agg_returned_orders_by_month
    description: >
      Monthly aggregation of returned orders and return rates. Tracks the number of 
      returned order items and calculates the return rate as a percentage of total orders.
    config:
      tags: ['designed_to_fail']
    columns:
      - name: order_month
        description: The first day of the month for the aggregated return data
        data_tests:
          - unique
          - not_null
      - name: returned_orders
        description: Count of order items that were returned in the month
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
      - name: return_rate
        description: Percentage of order items that were returned (returned_orders / total_orders)
      - name: row_count
        description: Total count of order items processed in the month

