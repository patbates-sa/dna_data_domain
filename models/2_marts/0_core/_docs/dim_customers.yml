# Documentation for dim_customers model
# Customer dimensions table with contract enforcement
# Includes semantic layer definitions for customer segmentation analysis

models:
  - name: dim_customers
    config:
      contract:
        enforced: true
      group: data_team
      access: public
      freshness:
        build_after:
          count: 4
          period: hour
          updates_on: all  # Only rebuild when ALL upstream dependencies have new data
    description: >
      Customer dimensions table at the individual customer level. This model also includes
      a semantic model that contains one row per customer and includes the customer key,
      enabling customer segmentation analysis by market segment, account balance, nation, and region.
    columns:
      - name: customer_key
        data_type: int
        description: Primary key on the customers table - unique identifier for each customer
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: customer
      - name: region
        data_type: varchar(25)
        description: The geographical region where the customer is located
        data_tests:
          - accepted_values:
              config:
                severity: warn
              arguments:
                values: ["AFRICA", "MIDDLE EAST", "ASIA", "EUROPE", "AMERICA"]
        dimension:
          type: categorical
      - name: name
        data_type: varchar(25)
        description: Full name of the customer
      - name: address
        data_type: varchar(40)
        description: Address of the customer
      - name: nation
        data_type: varchar(25)
        description: The country of the customer's residence
        dimension:
          type: categorical
      - name: phone_number
        data_type: varchar(15)
        description: Phone number of the customer
      - name: account_balance
        data_type: number(38,0)
        description: '{{ doc("account_balance") }}'
      - name: market_segment
        data_type: varchar(10)
        description: The market segment to which the customer belongs
        dimension:
          type: categorical
          name: customer_market_segment
      - name: lifetime_value
        data_type: int
        description: Lifetime value for the customer
      - name: tier_name
        data_type: string
        description: Tier of the customer
      - name: is_high_value
        data_type: varchar(1)
        description: High revenue account flag
      - name: is_mid_value
        data_type: varchar(1)
        description: Mid revenue account flag
      - name: is_low_value
        data_type: varchar(1)
        description: Low revenue account flag
    semantic_model:
      enabled: true
      name: customers
    derived_semantics:
      entities: []
      dimensions:
        - name: customer_balance_segment
          description: >
            The segment of the customer's account balance.
            This derived dimension is used to segment customers by account balance.
          type: categorical
          expr: |
            case
              when account_balance < 0 then 'Bad Debt'
              when account_balance < 2500 then 'Low'
              when account_balance < 7500 then 'Medium'
              else 'High'
            end
