# Documentation for fct_order_items model
# Order items fact table
# Includes semantic layer definitions for item-level analysis

models:
  - name: fct_order_items
    latest_version: 1
    versions:
      - v: 1

    data_tests:
      - dbt_expectations.expect_table_aggregation_to_equal_other_table:
          name: orders_sales_amount_equals_order_item_sales_amount
          arguments:
            expression: sum(net_item_sales_amount)
            compare_model: ref("fct_orders")
            compare_expression: sum(net_item_sales_amount)
            group_by: [order_key]
    description: >
      Line items for an order. An order_key can be represented multiple times in this table,
      with each row representing a single line item. This model also includes a semantic model
      that enables granular analysis of sales, expenses, and supplier metrics at the item level.
    columns:
      - name: order_item_key
        data_type: varchar(32)
        description: '{{ doc("order_item_key") }}'
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: order_item
      - name: order_key
        data_type: number(38,0)
        description: A unique identifier for the order associated with the item
        entity:
          type: foreign
          name: customer_order
      - name: order_date
        data_type: date
        description: The date when the order was placed
        dimension:
          type: time
        granularity: day
      - name: customer_key
        data_type: number(38,0)
        description: A unique identifier for the customer who placed the order
        entity:
          type: foreign
          name: customer
      - name: part_key
        data_type: number(38,0)
        description: Foreign key for parts
      - name: supplier_key
        data_type: number(38,0)
        description: A unique identifier for the supplier of the order item
        entity:
          type: foreign
          name: supplier
      - name: order_item_status_code
        data_type: varchar
        description: The status code representing the current state of the order item
      - name: is_return
        data_type: boolean
        description: '{{ doc("is_return") }}'
      - name: line_number
        data_type: number(38,0)
        description: '{{ doc("line_number") }}'
      - name: ship_date
        data_type: date
        description: The date when the order item was shipped, used for delivery timeline analysis
        dimension:
          type: time
        granularity: day
      - name: commit_date
        data_type: date
        description: The date when the order item was committed for shipment, used for fulfillment timeline analysis
        dimension:
          type: time
        granularity: day
      - name: receipt_date
        data_type: date
        description: The date when the order item was received by the customer, used for delivery timeline analysis
        dimension:
          type: time
        granularity: day
      - name: ship_mode
        data_type: varchar(10)
        description: '{{ doc("ship_mode") }}'
      - name: supplier_cost
        data_type: number(12,2)
        description: '{{ doc("cost") }}'
      - name: base_price
        data_type: number(16,3)
        description: '{{ doc("base_price") }}'
      - name: discount_percentage
        data_type: number(38,0)
        description: '{{ doc("discount_percentage") }}'
      - name: discounted_price
        data_type: number(16,3)
        description: '{{ doc("discounted_price") }}'
      - name: tax_rate
        data_type: number(38,0)
        description: '{{ doc("tax_rate") }}'
      - name: nation_key
        data_type: number(38,0)
        description: A unique identifier for the nation associated with the order item
        data_tests:
          - not_null
      - name: order_item_count
        data_type: number(1,0)
        description: The count of items in the order
      - name: quantity
        data_type: number(38,0)
        description: The quantity of the order item
      - name: gross_item_sales_amount
        data_type: number(38,0)
        description: '{{ doc("gross_item_sales_amount") }}'
      - name: discounted_item_sales_amount
        data_type: number(16,3)
        description: '{{ doc("discounted_item_sales_amount") }}'
      - name: item_discount_amount
        data_type: number(16,3)
        description: '{{ doc("item_discount_amount") }}'
      - name: item_tax_amount
        data_type: number(16,3)
        description: '{{ doc("item_tax_amount") }}'
      - name: net_item_sales_amount
        data_type: number(16,3)
        description: '{{ doc("net_item_sales_amount") }}'
    config:
      contract:
        enforced: true
      latest_version_pointer:
        enabled: true
      group: data_team
      access: public

    semantic_model:
      enabled: true
      name: order_items
    agg_time_dimension: order_date
    metrics:
      # Simple metrics
      - name: total_expense
        description: The total expense for the business, aggregated from supplier costs
        type: simple
        label: Total Expenses
        agg: sum
        expr: supplier_cost
      - name: total_supplier_revenue
        description: The total net revenue by supplier after discounts and taxes
        type: simple
        label: Total Supplier Revenue
        agg: sum
        expr: net_item_sales_amount
      - name: total_supplier_gross_revenue
        description: The total gross revenue by supplier before discounts and taxes
        type: simple
        label: Total Supplier Gross Revenue
        agg: sum
        expr: gross_item_sales_amount
      - name: total_items_sold
        description: The total number of items sold across all orders
        type: simple
        label: Total Items Sold
        agg: sum
        expr: quantity
      - name: total_gross_sales
        description: The total gross sales amount before discounts and taxes
        type: simple
        label: Total Gross Sales
        agg: sum
        expr: gross_item_sales_amount
      - name: average_gross_sales
        description: The average gross sales amount per order item
        type: simple
        label: Average Gross Sales
        agg: average
        expr: gross_item_sales_amount
      # Derived metrics
      - name: average_items_per_sale
        description: The average number of items per sale, calculated as total items sold divided by total gross sales
        type: ratio
        label: Average Items per Sale
        numerator: total_items_sold
        denominator: total_gross_sales
