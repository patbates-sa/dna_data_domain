# Documentation for fct_orders model
# Orders fact table
# Includes semantic layer definitions for order-level analysis

models:
  - name: fct_orders
    description: >
      Order fact table at the order level. This model also includes a semantic model that
      contains one row per order and includes the order key, enabling analysis of order-level
      metrics such as total revenue and customer counts.
    config:
      group: data_team
      access: public
    columns:
      - name: order_key
        description: A unique identifier for each order
        data_tests:
          - unique
          - not_null
        entity:
          type: primary
          name: customer_order
      - name: customer_key
        description: A unique identifier for the customer who placed the order
        data_tests:
          - relationships:
              name: fct_orders_customer_key_refs_dim_customers
              config:
                severity: error
              arguments:
                to: ref('dim_customers')
                field: customer_key
        entity:
          type: foreign
          name: customer
      - name: order_date
        description: The date on which the order was placed, used for daily-grain analysis
        dimension:
          type: time
        granularity: day
      - name: order_time
        description: The timestamp indicating the exact time the order was placed, used for hourly-grain analysis
        dimension:
          type: time
        granularity: hour
      - name: status_code
        description: The current status of the order, represented by a raw source code
        dimension:
          type: categorical
          name: order_status_code
      - name: status_label
        description: Standardized order status label derived from `status_code` using the shared `order_status_label()` macro.
        dimension:
          type: categorical
          name: order_status_label
      - name: priority_code
        description: A raw code indicating the priority level of the order
        dimension:
          type: categorical
          name: order_priority_code
      - name: priority_label
        description: Normalized priority band derived from `priority_code` using the shared `order_priority_label()` macro. Urgent maps to `P0`, high to `P1`, medium to `P2`, low to `P4`, and not specified maps to null.
        dimension:
          type: categorical
          name: order_priority_label
      - name: is_high_priority
        description: Boolean flag indicating whether the order is urgent or high priority according to the shared `is_high_priority_order()` macro.
        dimension:
          type: categorical
      - name: clerk_name
        description: The name of the clerk who processed the order
        dimension:
          type: categorical
          name: clerk_on_order
      - name: ship_priority
        description: The priority level for shipping the order
      - name: order_count
        description: The total number of items in the order
      - name: return_count
        description: The number of items returned from the order
      - name: gross_item_sales_amount
        description: '{{ doc("gross_item_sales_amount") }}'
      - name: item_discount_amount
        description: '{{ doc("item_discount_amount") }}'
      - name: item_tax_amount
        description: '{{ doc("item_tax_amount") }}'
      - name: net_item_sales_amount
        description: '{{ doc("net_item_sales_amount") }}'
    semantic_model:
      enabled: true
      name: orders
    agg_time_dimension: order_date
    metrics:
      # Simple metrics - these create measures and metrics on this semantic model
      - name: total_revenue
        description: The total revenue for the business, aggregated from gross item sales amounts
        type: simple
        label: Total Revenue
        agg: sum
        expr: gross_item_sales_amount
      - name: total_customers
        description: The total count of unique customers for the business
        type: simple
        label: Total Customers
        agg: count_distinct
        expr: customer_key
      # Ratio metric
      - name: average_revenue_per_customer
        description: The average revenue per customer, calculated as total revenue divided by total customers
        type: ratio
        label: Average Revenue per Customer
        numerator: total_revenue
        denominator: total_customers

# Top-level metrics that reference other metrics (cumulative and cross-model derived)
metrics:
  # Cumulative metrics - these reference existing metrics via input_metric
  - name: cumulative_revenue_total
    description: The cumulative total revenue for the business across all time
    type: cumulative
    label: Cumulative Revenue (All-Time)
    input_metric: total_revenue
  - name: cumulative_revenue_ttm
    description: Cumulative revenue for the trailing twelve months
    type: cumulative
    label: Cumulative Revenue (TTM)
    input_metric: total_revenue
    period_agg: first
    window: 12 months
  - name: weekly_customers
    description: Number of active weekly customers over a rolling 7-day window
    type: cumulative
    label: Weekly Active Customers
    input_metric: total_customers
    period_agg: first
    window: 7 days
  - name: monthly_customers
    description: Number of active monthly customers over a rolling 1-month window
    type: cumulative
    label: Monthly Active Customers
    input_metric: total_customers
    period_agg: first
    window: 1 month
  # Cross-model derived metric
  - name: total_profit
    description: >
      The total profit for the business, calculated as total revenue minus total expense.
      This derived metric provides the core profitability measure for financial analysis.
      Defaults to day-grain analysis, aligning total_revenue with total_expense from the order_items semantic model.
    type: derived
    label: Total Profit
    expr: revenue - expense
    input_metrics:
      - name: total_revenue
        alias: revenue
      - name: total_expense # This metric is defined in the order_items semantic model
        alias: expense
