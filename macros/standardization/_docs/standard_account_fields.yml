macros:
  - name: standard_account_fields
    description: |
      A macro that returns a comma-separated list of standard accounting fields for
      consistent column selection across finance-facing models.

      This is the shared column set for item- and order-level revenue reporting:
      - `gross_item_sales_amount`
      - `item_discount_amount`
      - `item_tax_amount`
      - `net_item_sales_amount`

      Use it when a model is passing these accounting fields through unchanged from an
      upstream relation. That keeps downstream marts aligned if the canonical set ever changes.

      The macro optionally accepts a relation alias so it can emit either bare column names
      or fully qualified references.

      **Usage examples:**
      ```sql
      select
        order_key,
        {% raw %}{{ standard_account_fields() }}{% endraw %}
      from order_item_summary
      ```

      ```sql
      select
        order_item_key,
        {% raw %}{{ standard_account_fields() }}{% endraw %}
      from order_item
      ```
    arguments:
      - name: relation_alias
        type: string
        description: Optional table or CTE alias to prefix onto each returned field.
